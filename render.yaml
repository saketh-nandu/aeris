services:
  - type: web
    name: aeris-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        value: sqlite:////tmp/aeris.db
      - key: SECRET_KEY
        value: aeris-tactical-secret-key-2026-production
